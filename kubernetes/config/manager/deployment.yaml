---
# The Namespace lives in config/namespace.yaml, applied first by both
# `make install` and `make deploy`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multiprox-operator
  namespace: multiprox-system
  labels:
    app.kubernetes.io/name: multiprox-operator
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: multiprox-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: multiprox-operator
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      serviceAccountName: multiprox-operator
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/feynman/multiprox-operator:latest
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=true
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --max-concurrent-reconciles=5
          env:
            - name: OPERATOR_VERSION
              value: "0.1.0"
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true

---
apiVersion: v1
kind: Service
metadata:
  name: multiprox-operator-metrics
  namespace: multiprox-system
  labels:
    app.kubernetes.io/name: multiprox-operator
    app.kubernetes.io/component: metrics
spec:
  selector:
    app.kubernetes.io/name: multiprox-operator
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
