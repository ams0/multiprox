# Proxmox VE datacenter configuration — multiprox
# Placed at /etc/pve/datacenter.cfg on first cluster init.
# See: https://pve.proxmox.com/wiki/Manual:_datacenter.cfg

# Cluster-wide bandwidth limits (0 = unlimited)
bwlimit:

# Cluster Resource Scheduling — spread VMs evenly across nodes
crs: ha=nodes

# HA shutdown policy: graceful VM shutdown before node reboot
ha: shutdown_policy=conditional

# Default keyboard layout for console sessions
keyboard: en-us

# Parallel workers for bulk operations (migrate, backup, etc.)
max_workers: 4

# VM migration: 'insecure' uses NBD without TLS — fine for a trusted
# Docker bridge network. Switch to 'secure' (SSH tunnel) for any
# network that touches the public internet.
migration: type=insecure,network=10.10.0.0/24
