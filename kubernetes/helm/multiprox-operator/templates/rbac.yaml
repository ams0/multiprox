{{- if .Values.serviceAccount.create -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "multiprox-operator.serviceAccountName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "multiprox-operator.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "multiprox-operator.fullname" . }}-role
  labels:
    {{- include "multiprox-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [proxmox.multiprox.io]
    resources: [proxmoxclusters]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [proxmox.multiprox.io]
    resources: [proxmoxclusters/status]
    verbs: [get, update, patch]
  - apiGroups: [proxmox.multiprox.io]
    resources: [proxmoxclusters/finalizers]
    verbs: [update]
  - apiGroups: [proxmox.multiprox.io]
    resources: [proxmoxnodes]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [proxmox.multiprox.io]
    resources: [proxmoxnodes/status]
    verbs: [get, update, patch]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [services, configmaps, secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "multiprox-operator.fullname" . }}-rolebinding
  labels:
    {{- include "multiprox-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "multiprox-operator.fullname" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ include "multiprox-operator.serviceAccountName" . }}
    namespace: {{ .Values.namespace }}
