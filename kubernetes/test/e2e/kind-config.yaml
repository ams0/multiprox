# kind cluster for multiprox e2e tests.
#
# Named multiprox-e2e so it cannot collide with any other kind cluster on the
# host. Every kubectl/helm command in the e2e scripts passes
# --context kind-multiprox-e2e explicitly rather than relying on
# current-context, so a pre-existing cluster is never touched.
#
# 3 workers so the operator's default pod anti-affinity can actually spread
# PVE nodes across distinct hosts — testing placement with 1 node would make
# the anti-affinity assertion vacuous.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: multiprox-e2e
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
  - role: worker
  - role: worker
  - role: worker
